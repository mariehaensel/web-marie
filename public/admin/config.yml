backend:
  name: git-gateway
  branch: main

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

locale: "de"

collections:
  - name: "home"
    label: "Startseite"
    editor: { preview: false }
    files:
      - label: "Hero / Startseite"
        name: "home"
        file: "src/content/home/home.md"
        fields:
          - { label: "Portraitfoto", name: "heroImage", widget: "image" }
          - { label: "Alt-Text zum Foto", name: "heroImageAlt", widget: "string", required: false }

  - name: "agenda"
    label: "Agenda / Termine"
    label_singular: "Termin"
    folder: "src/content/agenda"
    create: true
    delete: true
    slug: "{{fields.date}}-{{fields.slug}}"
    identifier_field: slug
    summary: "{{date}} — {{piece}}"
    sortable_fields: ["date"]
    fields:
      - { label: "Interner Titel (für Dateiname, z.B. bach-weihnachtsoratorium)", name: "slug", widget: "string" }
      - label: "Datum"
        name: "date"
        widget: "string"
        hint: "Format: JJJJ-MM-TT, z. B. 2026-09-13. Bitte genau so eintippen (der Kalender-Picker hat einen bekannten Fehler beim Tippen)."
        pattern: ['^\d{4}-\d{2}-\d{2}$', "Bitte im Format JJJJ-MM-TT eingeben, z. B. 2026-09-13"]
      - { label: "Uhrzeit", name: "time", widget: "string", required: false, hint: "z. B. 19:30 Uhr" }
      - { label: "Werk / Programm", name: "piece", widget: "string" }
      - { label: "Komponist", name: "composer", widget: "string", required: false }
      - { label: "Mitwirkende", name: "colleagues", widget: "text", required: false }
      - { label: "Orchester / Dirigent", name: "ensemble", widget: "string", required: false }
      - { label: "Ort / Venue", name: "venue", widget: "string" }
      - { label: "Link (z. B. Tickets oder weitere Infos)", name: "ticketLink", widget: "string", required: false }
      - { label: "Beschriftung für den Link", name: "ticketLabel", widget: "string", required: false, hint: "z. B. \"Tickets\" oder \"Weitere Infos\" – ohne Angabe wird \"Weitere Infos\" verwendet." }
      - { label: "Notiz (optional, im Text sichtbar)", name: "body", widget: "text", required: false }

  - name: "vita"
    label: "Vita"
    editor: { preview: false }
    files:
      - label: "Vita-Text"
        name: "vita"
        file: "src/content/vita/vita.md"
        fields:
          - { label: "Seitentitel", name: "title", widget: "string", default: "Vita" }
          - { label: "Kurztext für die Startseite", name: "excerpt", widget: "text", hint: "Kurze Zusammenfassung (2-3 Sätze), die auf der Startseite angezeigt wird." }
          - { label: "Portraitfoto (Startseite + Vita-Seite)", name: "photo", widget: "image" }
          - { label: "Vollständiger Text (für die Vita-Seite)", name: "body", widget: "markdown" }

  - name: "kontakt"
    label: "Kontakt"
    editor: { preview: false }
    files:
      - label: "Kontaktdaten"
        name: "kontakt"
        file: "src/content/kontakt/kontakt.md"
        fields:
          - { label: "E-Mail", name: "email", widget: "string" }
          - { label: "Instagram-Link", name: "instagram", widget: "string", required: false }
          - { label: "Hintergrundfoto (Kontakt-Bereich Startseite)", name: "backgroundImage", widget: "image" }
          - { label: "Zusatztext", name: "body", widget: "text", required: false }

  - name: "media"
    label: "Media / Audio / Video"
    label_singular: "Eintrag"
    folder: "src/content/media"
    create: true
    delete: true
    slug: "{{fields.title}}"
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - { label: "Bild (Vorschaubild oder Foto)", name: "image", widget: "image" }
      - { label: "Bildunterschrift", name: "caption", widget: "string", required: false }
      - { label: "Video-/Audio-Link (YouTube, Vimeo, Soundcloud – optional)", name: "videoUrl", widget: "string", required: false }
      - { label: "Kategorie", name: "category", widget: "select", options: [{ label: "Bühnenfoto", value: "buehne" }, { label: "Portrait", value: "portrait" }, { label: "Mitschnitt (Video/Audio)", value: "video" }], required: false }
      - { label: "Fotograf/in (Credit)", name: "credit", widget: "string", required: false }

  - name: "impressum"
    label: "Impressum"
    editor: { preview: false }
    files:
      - label: "Impressum"
        name: "impressum"
        file: "src/content/impressum/impressum.md"
        fields:
          - { label: "Inhalt", name: "body", widget: "markdown" }

  - name: "datenschutz"
    label: "Datenschutz"
    editor: { preview: false }
    files:
      - label: "Datenschutzerklärung"
        name: "datenschutz"
        file: "src/content/datenschutz/datenschutz.md"
        fields:
          - { label: "Inhalt", name: "body", widget: "markdown" }
